# Everything the container manager needs to configure the runner containers
# it creates. Held here rather than repeated per service, because both
# managers (real and mock) take the same set and the list is long enough that
# keeping two copies in step would not last.
#
# The first three are forwarded *into* each runner (see
# containerManager.RUNNER_ENV_KEYS); the DPASP_RUNNER_* ones are read by the
# manager itself and become the container's limits. `.env.example` documents
# all of them.
x-runner-config: &runner-config
  DPASP_RUN_TIMEOUT: ${DPASP_RUN_TIMEOUT:-300}
  DPASP_RUN_MEM_MB: ${DPASP_RUN_MEM_MB:-1024}
  DPASP_MAX_OUTPUT: ${DPASP_MAX_OUTPUT:-65536}
  DPASP_RUNNER_CPUS: ${DPASP_RUNNER_CPUS:-1.0}
  DPASP_RUNNER_MEM: ${DPASP_RUNNER_MEM:-3g}
  DPASP_RUNNER_PIDS: ${DPASP_RUNNER_PIDS:-256}
  DPASP_RUNNER_TMPFS_MB: ${DPASP_RUNNER_TMPFS_MB:-256}
  DPASP_RUNNER_READONLY: ${DPASP_RUNNER_READONLY:-1}
  # Off by default: runners sit on an internal network with no route out.
  # Set to 1 to attach the default bridge as well, which a `#learn` from a URL
  # needs. The MNIST example does not: its dataset is cached in the runner
  # image at /opt/mnist.
  DPASP_RUNNER_ALLOW_NETWORK: ${DPASP_RUNNER_ALLOW_NETWORK:-0}

services:
  # The only container that touches the Docker socket.
  #
  # The manager has to create containers, and until this service existed that
  # meant mounting `/var/run/docker.sock` into it. That socket is root on the
  # host: anything that can reach it can start a container with `Binds: ["/:
  # /host"]` and `Privileged: true` and own the machine. With the runners
  # themselves now tightly bounded, the manager was the softest thing in the
  # stack — the one component whose compromise gave away everything.
  #
  # So the socket lives here, and the manager talks to this over TCP on an
  # internal network the frontend is not on. `backend/dockerProxy/policy.py`
  # is the whole policy: an allowlist of the calls the manager makes, with the
  # dangerous fields of a create request *overwritten* rather than checked.
  docker-proxy: &proxy
    build:
      context: backend/dockerProxy
      dockerfile: Dockerfile
    profiles:
      - dpasp
      - dpasp-prod
    restart: ${DPASP_RESTART:-no}
    networks:
      - dockerproxy
    # No `ports:`. Publishing this would hand the host's Docker daemon to
    # anything that can reach the machine — a worse hole than the one it
    # closes.
    volumes:
      # Set DOCKER_SOCKET when the daemon's socket is somewhere else, as it is
      # under colima. Put it in a `.env` file next to this file, or export it:
      #   DOCKER_SOCKET=$(docker context inspect \
      #     -f '{{.Endpoints.docker.Host}}' | sed 's|^unix://||')
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    # Root, because the socket is root:docker 0660 and the gid differs per
    # host — but root holding nothing else. The process needs no capabilities
    # and writes nothing outside /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777,nosuid,nodev,noexec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

  # The runner image, built by Compose rather than by the container manager.
  #
  # The manager used to build it itself, at startup, through the Docker API.
  # That was the last thing `docker-proxy` had to allow — `POST /build` runs a
  # Dockerfile, which means `RUN` steps as root in a build container — and the
  # last way a compromised web tier could make the daemon *execute* something.
  # Compose can do it, so Compose does, and `/build` came off the allowlist.
  #
  # This service exists to be *built*, so its container is a one-shot task:
  # `entrypoint` replaces the image's uvicorn command with an echo, and the
  # manager waits on `service_completed_successfully`. A runner container that
  # actually served would be wrong here — it would be unmanaged, unbounded,
  # and on the wrong network — so the container that does start says what it
  # is and exits 0.
  #
  # The entrypoint is a *runtime* override; the image keeps its own `CMD`, and
  # that is what the runners the manager creates will run.
  #
  # `restart` is pinned rather than following DPASP_RESTART, because a
  # container that exits immediately under `unless-stopped` would restart for
  # ever.
  runner-image: &runner-image
    image: dpasp-runner
    build:
      context: backend/dPaspRunner
      dockerfile: Dockerfile
      target: dpasp
    profiles:
      - dpasp
      - dpasp-prod
    entrypoint:
      - /bin/echo
      - "runner image built and tagged dpasp-runner. This container is not a
        runner: it exits now, and the container manager creates the real ones."
    restart: "no"

  runner-image-mock:
    <<: *runner-image
    build:
      context: backend/dPaspRunner
      dockerfile: Dockerfile
      target: mock
    profiles:
      - mock

  container-manager: &cm
    environment:
      <<: *runner-config
      # The whole point of docker-proxy. `docker.from_env()` reads this, so
      # the manager's own code did not change: it makes the same calls, and
      # the ones it is not supposed to make now fail with 403 instead of
      # succeeding.
      DOCKER_HOST: tcp://docker-proxy:2375
    build:
      context: backend
      dockerfile: Dockerfile
    # `dpasp-prod` is the same manager with the built frontend in front of it
    # — see the `frontend-prod` service.
    profiles:
      - dpasp
      - dpasp-prod
    # `no` in development; put DPASP_RESTART=unless-stopped in the `.env` on a
    # server so the stack comes back after a reboot.
    restart: ${DPASP_RESTART:-no}
    # Long form, because the two conditions differ: the proxy has to be up,
    # and the image build has to have *finished*. `service_completed_
    # successfully` is what makes `runner-image` an ordering guarantee rather
    # than a hope — the manager's `ensureImage` would otherwise be racing the
    # build on a cold cache.
    depends_on:
      docker-proxy:
        condition: service_started
      runner-image:
        condition: service_completed_successfully
    networks:
      - cm
      - dockerproxy
    ports:
      - 8001:80
    # No volumes. The socket mount that used to be here is what this whole
    # change removed; if you find yourself adding it back, the proxy is
    # refusing a call and the fix is to allow it in `policy.py` deliberately.

  docker-proxy-mock:
    <<: *proxy
    profiles:
      - mock
    networks:
      dockerproxy:
        aliases:
          - docker-proxy

  container-manager-mock:
    <<: *cm
    profiles:
      - mock
    environment:
      <<: *runner-config
      DOCKER_HOST: tcp://docker-proxy:2375
    depends_on:
      docker-proxy-mock:
        condition: service_started
      runner-image-mock:
        condition: service_completed_successfully
    networks:
      cm:
        aliases:
          - container-manager
      dockerproxy: {}

  # Development frontend: Vite's dev server, with the source bind-mounted for
  # hot reload. Not something to expose to a network — it serves the source
  # tree and watches the filesystem. Use `frontend-prod` for that.
  frontend:
    build:
      context: ./editor
      dockerfile: Dockerfile
      target: dev
    profiles:
      - dpasp
      - mock
    networks:
      - cm
      - dpasp-instances
    ports:
      - 8000:80
    volumes:
      - ./editor:/app
      # Keeps the image's node_modules from being shadowed by the bind mount
      # above. Without it the mounted source tree (which has no node_modules)
      # hid the installed tree, which is why the dev container had to run
      # `npm install` — and print its deprecation and version notices — on
      # every start.
      #
      # Docker fills a named volume from the image only when the volume is
      # empty, so this one used to go stale as soon as package.json changed.
      # The dev image's entrypoint now refreshes it from /opt/node_modules
      # whenever the lockfile's hash differs from the stamp inside it, so
      # `up --build` is enough and `down -v` is not needed.
      - editor_node_modules:/app/node_modules
    # OAuth is optional: with none of these set, every visitor gets an
    # anonymous session and the sign-in link is hidden. To enable it, put the
    # values in a `.env` file next to this compose file (Compose reads it
    # automatically) — see editor/.env.example for what they mean.
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOOGLE_ID: ${GOOGLE_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      # Hostnames Vite's dev server will answer to, comma-separated. Without
      # the machine's own name here it refuses the request with
      # "Blocked request. This host (...) is not allowed." — a DNS-rebinding
      # guard, which is one more reason the dev server does not belong on a
      # network. See allowedHosts() in editor/vite.config.ts.
      DPASP_ALLOWED_HOSTS: ${DPASP_ALLOWED_HOSTS:-}

  # Production frontend: the app built by adapter-node and served by `node
  # build`. No Vite at run time, no source in the image beyond what the build
  # needed, no host check to configure.
  #
  #   docker compose --profile dpasp-prod up -d --build
  #
  # Set DPASP_ORIGIN in the `.env` next to this file to the URL users type —
  # without it the handler assumes https:// and derives the host from the
  # request, which breaks links and OAuth callbacks on a plain-HTTP
  # deployment:
  #
  #   DPASP_ORIGIN=http://kamel.ime.usp.br:8000
  #
  # Behind a reverse proxy that terminates TLS, leave DPASP_ORIGIN empty and
  # set the two header variables instead:
  #
  #   DPASP_PROTOCOL_HEADER=x-forwarded-proto
  #   DPASP_HOST_HEADER=x-forwarded-host
  frontend-prod:
    build:
      context: ./editor
      dockerfile: Dockerfile
      target: production
    profiles:
      - dpasp-prod
    restart: ${DPASP_RESTART:-no}
    networks:
      - cm
      - dpasp-instances
    ports:
      - ${DPASP_PORT:-8000}:3000
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOOGLE_ID: ${GOOGLE_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      ORIGIN: ${DPASP_ORIGIN:-}
      PROTOCOL_HEADER: ${DPASP_PROTOCOL_HEADER:-}
      HOST_HEADER: ${DPASP_HOST_HEADER:-host}
      # Bytes. adapter-node's own default is 512 kB, and an upload is one
      # JSON body, so anything larger would come back as
      # "413 Invalid request body". Raise it further for larger data files.
      BODY_SIZE_LIMIT: ${DPASP_BODY_SIZE_LIMIT:-33554432}
      # Matches the editor's own proxy timeout; a run may hold the connection
      # open for the whole DPASP_RUN_TIMEOUT.
      DPASP_PROXY_TIMEOUT_MS: ${DPASP_PROXY_TIMEOUT_MS:-330000}

volumes:
  # Holds the frontend's installed node_modules across restarts; see the
  # frontend service's volumes for why it exists.
  editor_node_modules:

networks:
  # The frontend reaches the container manager over this one, and it is where
  # the frontend's published port and its own route out live.
  cm:
    driver: bridge

  # Runner containers live here and nowhere else, which is what stops a dPASP
  # program from reaching the network.
  #
  # `internal: true` is the whole point: Docker gives such a network no
  # gateway, so a container attached only to it has no route off the host.
  # The manager attaches runners to this network *at creation*
  # (`containers.run(network=...)`) rather than afterwards, because a
  # container Docker attaches by default lands on the default bridge, which
  # is masqueraded — it would have the internet before anything else ran.
  #
  # The frontend is on this network too, so that it can reach the runners, and
  # on `cm` as well. A container with both keeps its default route and its
  # published ports on the non-internal one, so publishing 8000 is unaffected.
  #
  # To let programs reach the internet again — `learning.pasp` reads a CSV
  # over https as shipped — set DPASP_RUNNER_ALLOW_NETWORK=1 rather than
  # changing this: the manager then attaches the default bridge to each runner
  # as well.
  dpasp-instances:
    driver: bridge
    internal: true

  # The container manager and the Docker socket proxy, and nothing else. The
  # frontend is deliberately not here: it faces the browser, and a request it
  # could be tricked into making must not be able to reach the proxy at all —
  # the proxy's allowlist is the second line of defence, not the first.
  #
  # `internal: true` because neither end needs a route off the host. The
  # manager keeps its own route through `cm`.
  dockerproxy:
    driver: bridge
    internal: true
